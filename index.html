<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Catalogo AG</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{ --accent:#2196F3; }
  
  /* ==== ANIMAZIONE FADE + SLIDE ==== */
@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
  *{box-sizing:border-box}
html, body{
  width:100%;
  overflow-x: hidden; /* fallback */
  overflow-x: clip;   /* meglio: evita la barra senza “tagliare” */
}
  body{
    margin:0;
    font-family:Inter, Arial, sans-serif;
    color:#fff;
    background:#05060a;
  }
  /* Sfondo astratto */
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 10% 0%, #303f9f33 0, transparent 50%),
      radial-gradient(circle at 90% 100%, #00897b33 0, transparent 55%),
      radial-gradient(circle at 50% 50%, #1a237e11 0, #000 70%);
    z-index:-1;
  }
/* HERO NETFLIX STYLE */
  #hero-loader{
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: radial-gradient(circle at center, #1a237e 0%, #05060a 65%);
  animation: heroFill 0.9s cubic-bezier(.4,0,.2,1) forwards;
  pointer-events: none;
}

@keyframes heroFill{
  from{ transform: scale(1.15); opacity: 1; }
  to{   transform: scale(1);    opacity: 0; }
}
.hero-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
  background:#05060a;
}

.hero-grid{
  position:absolute;
  top:-28%;
  left:-28%;
  width:156%;
  height:156%;
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:12px;
  grid-auto-flow: dense;

  /* prospettiva tipo “parete” Netflix */
  transform: perspective(1200px) rotateX(18deg) rotateZ(-8deg) scale(1.08);
  opacity:0.28;

  /* look più Netflix */
 filter: saturate(1.20) contrast(1.08) brightness(1.02);

  transition: opacity .9s ease;
  will-change: transform;
}

.hero-grid.visible{
  opacity:0.62;
}

/* Drift lento (tipo Netflix) */
@keyframes wallDrift{
  0%{
    transform: perspective(1200px) rotateX(18deg) rotateZ(-8deg)
      translate3d(-2%, -1.5%, 0) scale(1.08);
  }
  100%{
    transform: perspective(1200px) rotateX(18deg) rotateZ(-8deg)
      translate3d(2%, 1.5%, 0) scale(1.08);
  }
}

/* attiva solo quando visible */
.hero-grid.visible{
  animation: wallDrift 26s linear infinite alternate;
}

.hero-grid img{
  width:100%;
  height:auto;
  object-fit:cover;
  border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,0.55);
  aspect-ratio: 2 / 3;
}

.hero-grid img.wide{
  grid-column: span 2;
  aspect-ratio: 3 / 2; 
}

/* Overlay scuro + vignetta Netflix-style */
.hero-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at center,
      rgba(0,0,0,0.05) 0%,
      rgba(0,0,0,0.45) 68%,
      rgba(0,0,0,0.70) 100%
    ),
    linear-gradient(to bottom,
      rgba(0,0,0,0.45) 0%,
      rgba(0,0,0,0.18) 45%,
      rgba(0,0,0,0.62) 100%
    );
}

  /* HOME */
  #home{
    position: relative;
    overflow: hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px 60px;
  }
  .home-inner{
    max-width:1100px;
    width:100%;
    display:grid;
    grid-template-columns: minmax(0,1.1fr) minmax(0,1.1fr);
    gap:40px;
    align-items:center;
    position:relative;
    z-index:2;
  }
  @media(max-width:900px){
    .home-inner{
      grid-template-columns:1fr;
      text-align:center;
    }
  }

  .home-hero{
    padding:24px 22px;
    border-radius:20px;
    background:linear-gradient(145deg,rgba(0,0,0,0.85),rgba(0,0,0,0.7));
    box-shadow:0 18px 50px rgba(0,0,0,0.8);
    border:1px solid rgba(255,255,255,0.04);
  }

  /* Logo AG */
  .logo-wrap{
    display:flex;
    justify-content:flex-start;
    margin-bottom:12px;
  }
  @media(max-width:900px){
    .logo-wrap{justify-content:center;}
  }
  .logo-ag{
    width:120px;
    height:auto;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.8));
  }

  .home-hero h1{
    margin:4px 0 8px;
    font-size:32px;
    letter-spacing:0.5px;
    text-shadow:0 2px 8px #000;
  }
  .home-subtitle{
    margin:0 0 8px;
    font-size:15px;
    color:#c5cae9;
    opacity:0.9;
  }
  .home-text{
    margin:0 0 22px;
    font-size:15px;
    color:#e0e0e0;
    line-height:1.5;
  }
.buttons-label{
  margin:0 0 14px;
  font-size:13px;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:#b0bec5;
  opacity:0.85;
}
.btn{
  padding: 14px 26px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14);

  /* meno “glossy”, più clean */
  background: rgba(255,255,255,0.10);
  color: #fff;

  cursor: pointer;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: 0.2px;

  box-shadow: 0 10px 24px rgba(0,0,0,0.45);
  transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}

.btn:hover{
  transform: translateY(-2px);
  background: rgba(255,255,255,0.16);
  border-color: rgba(255,255,255,0.22);
  box-shadow: 0 14px 32px rgba(0,0,0,0.55);
}

.btn:active{
  transform: translateY(0px) scale(0.98);
}
  #adminAddBtn{
  background: rgba(33,150,243,0.18);
  border-color: rgba(33,150,243,0.35);
}
#adminAddBtn:hover{
  background: rgba(33,150,243,0.26);
  border-color: rgba(33,150,243,0.50);
}
  @media (max-width: 600px){
  .btn{
    width: 100%;
    justify-content: center;
  }
}

/* CATALOGO */
#catalog{
  display:none;
  padding:20px 24px 60px;
  background:radial-gradient(circle at top,#1a237e33 0,transparent 55%), #020308;
  min-height:100vh;
}
#catalog-title{
  font-size:26px;
  margin:8px 0 14px;
  text-shadow:0 2px 6px #000;
}

/* Barra superiore: logo + categorie + ricerca */
.controls{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:10px 16px;
  background:linear-gradient(to bottom, rgba(5,6,15,0.96), rgba(5,6,15,0.9));
  backdrop-filter:blur(10px);
}

/* Quando scrolli, nascondi solo la ricerca */
.controls.scrolled .search{
  display:none;
}
  @media (max-width: 768px){
  .controls.scrolled .search{
    display:flex !important;
  }
}

/* Logo mini AG */
.logo-mini {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-mini img {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  transition: transform .15s, box-shadow .15s;
}

.logo-mini img:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.7);
}
.logo-mini:active {
  transform: scale(0.92);
}
/* Categorie: pillole distanziate */
.filters{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
}

.filters button{
  background:rgba(255,255,255,0.08);
  border:none;
  color:#e0e0e0;
  padding:7px 16px;
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  transition:background .15s ease, transform .15s ease, box-shadow .15s ease, color .15s ease;
}

.filters button:hover{
  background:rgba(255,255,255,0.16);
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(0,0,0,0.6);
}

.filters button.active{
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
}

/* Ricerca allineata alla stessa altezza */
.search{
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.search input{
  height:36px;
  padding:0 14px;
  border-radius:999px;
  border:none;
  background:#ffffff;
  color:#222;
  min-width:220px;
  outline:none;
  font-size:14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
  gap:18px;
  width:100%;
  max-width:1200px;
  grid-auto-flow:dense;
}

/* Card base */
.card{
  position:relative;
  border-radius:12px;
  cursor:pointer;
  overflow:hidden;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 26px rgba(0,0,0,0.55);
  transition:transform .15s, box-shadow .15s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 40px rgba(0,0,0,0.70);
}

/* Thumb con aspect ratio controllato */
.card .thumb{
  width:100%;
  aspect-ratio: 2 / 3;      /* poster verticale */
  position:relative;
  background:#0b0f16;
}

.card.wide .thumb{
  aspect-ratio: 16 / 9;     /* backdrop orizzontale */
}

/* immagine sempre “fill” */
.card .thumb img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.01);
}

/* Wide = occupa 2 colonne (su desktop) */
@media (min-width: 700px){
  .card.wide{
    grid-column: span 2;
  }
}

/* Titolo in overlay (Netflix-style) */
.card .info{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:10px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0));
}

.card .title{
  font-weight:800;
  margin:0;
  font-size:14px;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}

.card .meta{
  margin-top:4px;
  font-size:12px;
  color:rgba(255,255,255,0.85);
}
  .card img{width:100%;border-radius:8px;margin-bottom:8px}
  .title{font-weight:700;margin-bottom:6px}
  .meta{font-size:13px;color:#ddd}

  /* MODALE */
  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
    z-index:9999;align-items:center;justify-content:center;padding:20px
  }
  .modal .inner{
    background:#0f1720;color:#fff;border-radius:12px;padding:20px;
    max-width:900px;width:100%;max-height:85vh;overflow:auto;
    box-shadow:0 10px 40px #000;
  }
  .modal .close{float:right;font-size:24px;cursor:pointer;color:#bbb}
  .modal h2{margin-top:6px}
  .modal p{line-height:1.5;color:#e6e6e6}
  .cast{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .cast .person{
    display:flex;flex-direction:column;align-items:center;
    width:80px;font-size:12px;text-align:center
  }
  .cast img{width:64px;height:64px;border-radius:6px;object-fit:cover}

  @media(max-width:640px){
    .card{padding:8px}
    .title{font-size:15px}
  }
  .catalog-logo {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(145deg, #42a5f5, #7e57c2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 6px;
  cursor: pointer;
  user-select: none;
  font-weight: 700;
  letter-spacing: 1px;
  font-size: 15px;
  font-family: Inter, sans-serif;
  box-shadow: 0 3px 10px rgba(0,0,0,0.45);
  transition: transform .15s, box-shadow .15s;
}

.catalog-logo:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.55);
}
/* LOGO AG NELLA BARRA DELLE CATEGORIE */
.logo-btn {
    cursor: pointer;
    display: flex;
    align-items: center;
    margin-right: 16px;
    transform: scale(0.8);
    transition: transform .2s ease, opacity .2s ease;
}

.logo-btn svg {
    width: 95px;
    height: auto;
}

.logo-btn:hover {
    transform: scale(0.88);
    opacity: 0.85;
}
.home-icon{
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display:block;
}

/* animazioni */
.fade-out {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity .35s ease, transform .35s ease;
}
.fade-in {
  opacity: 1;
  transform: translateY(0);
  transition: opacity .35s ease, transform .35s ease;
}

/* mobile più “corto” */
@media (max-width: 600px){
  .fade-out{ transform: translateY(10px); }
}
#catalog-footer {
  margin-top: 40px;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: #9ea7b3;
  opacity: 0.8;
}
.hero-content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:70px 20px 40px;
}

.hero-center{
  position: relative;
  text-align: center;

  max-width: 980px;            /* prima 920 */
  margin: -60px auto 52px;     /* un pelo più “importante” */
  padding: 36px 34px 30px;     /* prima 28/26/26 */
  border-radius: 26px;

  background: radial-gradient(circle at center, rgba(255,255,255,0.07) 0%, rgba(0,0,0,0) 72%);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  box-shadow: 0 22px 70px rgba(0,0,0,0.38);
}

.hero-center h1{
  font-size: clamp(58px, 6.6vw, 92px);  /* un pelo più grande */
  line-height: 0.98;
  margin: 0 0 14px;
}

.hero-sub{
  font-size: clamp(19px, 2.35vw, 26px);
  max-width: 820px;            /* più respiro */
  margin: 0 auto 28px;
}

/* bottoni */
.hero-center .buttons{
  display: flex;              /* invece di inline-flex */
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
  margin-bottom: 18px;        /* spazio prima di +Aggiungi */
}

/* aura resta uguale, ma agganciala alla riga bottoni */
.hero-center .buttons::after{
  content:"";
  position:absolute;
  left:50%;
  top:100%;
  transform:translateX(-50%);
  width: min(560px, 92vw);
  height: 84px;

  background:
    radial-gradient(ellipse at center,
      rgba(126,87,194,0.45) 0%,
      rgba(33,150,243,0.28) 35%,
      rgba(0,0,0,0) 72%
    ),
    linear-gradient(to bottom,
      rgba(0,0,0,0.0) 0%,
      rgba(0,0,0,0.25) 55%,
      rgba(0,0,0,0.0) 100%
    );

  filter: blur(10px);
  opacity: 0.9;
  pointer-events: none;
  z-index: 0;
}
.serie-wrapper{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
/* bottone admin sotto, più “secondario” */
.btn-admin{
  display: block;
  background: rgba(33,150,243,0.14);
  border-color: rgba(33,150,243,0.32);
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}
.admin-row{
  display: flex;
  justify-content: center;
}
.btn-admin:hover{
  background: rgba(33,150,243,0.22);
  border-color: rgba(33,150,243,0.48);
}
@media (max-width: 600px){
  .hero-center .buttons::after{
    height: 70px;
    filter: blur(9px);
    opacity: 0.85;
  }
}
</style>
</head>
<body>
<div id="hero-loader"></div>
<div class="bg" aria-hidden="true"></div>

<section id="home">
  <div class="hero-bg">
    <div class="hero-grid" id="heroGrid"></div>
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-content">
    <div class="hero-center">
      <h1>Catalogo AG</h1>
      <p class="hero-sub">La nostra collezione di film e serie visti dal 2020</p>

<div style="display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;">
  
  <div style="display:flex; gap:16px;">
    <button class="btn" onclick="openCatalog('movie')">Film</button>
    <button class="btn" onclick="openCatalog('tv')">Serie TV</button>
    <button class="btn" onclick="openCatalog('todo')">Da vedere</button>
    <button class="btn btn-admin"
          id="adminAddBtn"
          style="display:none;"
          onclick="openAddForm()">
    +
  </button>

</div>
    <div style="display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;">
      <button class="btn btn-admin" id="adminLoginBtn" onclick="loginFromSite()">Accesso amministratore</button>
      <button class="btn btn-admin" id="adminLogoutBtn" style="display:none" onclick="logoutFromSite()">Esci</button>
    </div>
    <p id="adminStatus" style="font-size:12px; color:#b0bec5; margin-top:10px;"></p>
    </div>
  </div>
</section>
<!-- CATALOGO -->
<section id="catalog">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div id="catalog-title">Catalogo</div>

<div class="controls">

    <!-- Logo AG mini = torna alla home -->
<button class="logo-mini" onclick="tornaHomeAnimated()" aria-label="Torna alla home">
  <img src="favicon.png" alt="Home" />
</button>
    <!-- Categorie -->
    <div class="filters" id="filters"></div>

    <!-- Ricerca -->
    <div class="search">
        <input id="searchInput" placeholder="Cerca per titolo..." />
    </div>

</div>
    <p id="catalogNotice" role="status" style="color:#ffcc80;text-align:center;max-width:700px;"></p>
    <div class="grid" id="grid"></div>
    <div id="catalog-footer"></div>
  </div>
</section>

<!-- MODALE -->
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="inner" role="dialog" aria-modal="true">
    <div class="close" id="closeBtn">&times;</div>
    <h2 id="modalTitle"></h2>
    <p id="modalOverview"></p>
    <h4>Cast principale</h4>
    <div class="cast" id="modalCast"></div>
  </div>
</div>
<div id="addModal" class="modal" style="display:none;" onclick="if(event.target===this) closeAddModal()">
  <div class="inner" style="max-width:500px;">
    <div class="close" onclick="closeAddModal()">&times;</div>
    <h2>Aggiungi nuovo titolo</h2>

    <label>Titolo:</label>
    <input id="addTitle" style="width:100%; margin-bottom:10px; padding:6px;">

    <label>ID TMDb (facoltativo):</label>
    <input id="addId" style="width:100%; margin-bottom:10px; padding:6px;">

    <label>Tipo:</label>
    <select id="addType" style="width:100%; margin-bottom:10px; padding:6px;">
      <option value="movie">Film</option>
      <option value="tv">Serie TV</option>
    </select>

    <label style="display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="addTodo">
      Inserisci tra i titoli "Da vedere"
    </label>

    <button id="submitAddBtn" onclick="submitAddForm()" style="margin-top:12px; width:100%; padding:10px; border-radius:8px; cursor:pointer;">
      Aggiungi al catalogo
    </button>
  </div>
</div>
<script>
 const GS_BASE = "https://script.google.com/macros/s/AKfycbymZUtlVPioO6WFtQOfZ_XLXqFO4b48vHIZ4ZXOZosBPFX6y9S8psozQ3LyUbFlz4Pc3w/exec";

const CACHE_KEYS = {
  version: "CATALOG_CACHE_VERSION",
  movies:  "CATALOG_CACHE_MOVIES",
  heroGrid: "CATALOG_CACHE_HERO_GRID",
  time:    "CATALOG_CACHE_TIME"
};
const API_KEY  = '9298687fa5e1f883f34db8ce4844c806';
// --- Autenticazione Cloudflare: nessun segreto nel codice pubblico ---
const WORKER_BASE = "https://catalogo-ag-api.joshgeogr.workers.dev";
let adminToken = null;
let adminExpiresAt = 0;
let adminBusy = false;
const isAdmin = () => Boolean(adminToken && Date.now() < adminExpiresAt);
function updateAdminUI() {
  const loggedIn = isAdmin();
  document.getElementById("adminAddBtn").style.display = loggedIn ? "block" : "none";
  document.getElementById("adminLoginBtn").style.display = loggedIn ? "none" : "block";
  document.getElementById("adminLogoutBtn").style.display = loggedIn ? "block" : "none";
  document.getElementById("adminStatus").textContent = loggedIn
    ? "Accesso amministratore attivo."
    : "";
}
async function loginFromSite() {
  if (adminBusy) return;
  const password = prompt("Password amministratore Cloudflare:");
  if (password === null) return;
  adminBusy = true;
  try {
    const response = await fetch(WORKER_BASE + "/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password})
    });
    const result = await response.json();
    if (!response.ok || !result.success || !result.token) {
      alert(result.error === "TOO_MANY_REQUESTS" ? "Troppi tentativi. Attendi un minuto." : "Accesso non riuscito.");
      return;
    }
    adminToken = result.token;

const API_BASE = 'https://api.themoviedb.org/3';

function normalizeTitle(t){
  return t
    .replace(/’/g, "'")  // apostrofo curvo → apostrofo normale
    .replace(/‘/g, "'")  // altro tipo di apostrofo curvo
    .toLowerCase()
    .trim();
}
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQnH2Zqe52gw2KTWFy9QpxNcqq3giSz-Xn1oAIa9Sk7cgf8-aJ4_Klri9oe2Dq8EN7CiHx0Gx87B9Av/pub?output=csv";
const MIGRATED_HTML_COUNT = 244;
const MOVIES_STORAGE = "CATALOG_AG_SHEETS_ONLY_V1";
const VERSION_STORAGE = "CATALOG_AG_SHEETS_ONLY_VERSION_V1";

// Parser CSV: gestisce correttamente virgole, doppi apici e a capo tra virgolette.
function parseCSV(csv) {
  const rows = [];
  let row = [], field = '', quoted = false;
  csv = csv.replace(/^\uFEFF/, '');
  for (let i = 0; i < csv.length; i++) {
    const ch = csv[i];
    if (ch === '"') {
      if (quoted && csv[i + 1] === '"') { field += '"'; i++; }
      else quoted = !quoted;
    } else if (ch === ',' && !quoted) {
      row.push(field); field = '';
    } else if ((ch === '\n' || ch === '\r') && !quoted) {
      if (ch === '\r' && csv[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else {
      field += ch;
    }
  }
  if (quoted) throw new Error('CSV_NON_VALIDO');
  row.push(field);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}

async function fetchRemoteVersion() {
  try {
    const res = await fetch(`${GS_BASE}?action=version`, {cache:'no-store'});
    if (!res.ok) return null;
    const data = await res.json();
    const version = Number(data.version);
    return Number.isFinite(version) && version > 0 ? version : null;
  } catch (e) {
    console.warn('Versione non disponibile:', e);
    return null;
  }
}

function clearCatalogCache() {
  localStorage.removeItem(MOVIES_STORAGE);
  localStorage.removeItem(VERSION_STORAGE);
  Object.values(CACHE_KEYS).forEach(key => localStorage.removeItem(key));
}

function applySheetMovies(items) {
  movies.length = 0;
  movies.push(...items.map(m => ({...m, _fromSheet:true})));
  sheetLoaded = true;
}

async function loadMoviesFromSheet() {
  const url = SHEET_CSV_URL + '&_=' + Date.now();
  const response = await fetch(url, {cache:'no-store'});
  if (!response.ok) throw new Error('CSV_HTTP_' + response.status);
  const rows = parseCSV(await response.text());
  if (!rows.length) throw new Error('CSV_VUOTO');
  const headers = rows.shift().map(h => h.trim().toLowerCase());
  const required = ['title','type','id','search','todo'];
  if (!required.every(name => headers.includes(name))) throw new Error('COLONNE_CSV_ERRATE');
  const items = rows.map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (row[i] || '').trim());
    return {
      title: obj.title || '',
      type: obj.type,
      id: /^\d+$/.test(obj.id) ? Number(obj.id) : null,
      search: obj.search || '',
      todo: (obj.todo || 'no').toLowerCase()
    };
  }).filter(m => m.title && ['movie', 'tv'].includes(m.type));
  // Blocca solo un feed chiaramente precedente alla migrazione.
  if (items.length < MIGRATED_HTML_COUNT) {
    throw new Error(`CSV_NON_AGGIORNATO: solo ${items.length} titoli visibili, attesi almeno ${MIGRATED_HTML_COUNT}.`);
  }
  applySheetMovies(items);
  return items;
}

async function loadMoviesWithCache(force = false) {
  const remoteVersion = await fetchRemoteVersion();
  if (!force && remoteVersion !== null) {
    try {
      const cacheVersion = Number(localStorage.getItem(VERSION_STORAGE));
      const cached = JSON.parse(localStorage.getItem(MOVIES_STORAGE) || 'null');
      if (cacheVersion === remoteVersion && Array.isArray(cached) && cached.length >= MIGRATED_HTML_COUNT) {
        applySheetMovies(cached);
        return cached;
      }
    } catch (e) { /* cache non valida, passiamo alla rete */ }
  }
  try {
    const items = await loadMoviesFromSheet();
    try {
      localStorage.setItem(MOVIES_STORAGE, JSON.stringify(items));
      if (remoteVersion !== null) localStorage.setItem(VERSION_STORAGE, String(remoteVersion));
      else localStorage.removeItem(VERSION_STORAGE);
    } catch (e) { console.warn('Cache non disponibile', e); }
    return items;
  } catch (e) {
    console.error('Errore caricamento Google Sheets:', e);
    // In assenza di rete, dati in cache utilizzabili SOLO se sono già quelli migrati.
    try {
      const cached = JSON.parse(localStorage.getItem(MOVIES_STORAGE) || 'null');
      if (Array.isArray(cached) && cached.length >= MIGRATED_HTML_COUNT) {
        applySheetMovies(cached);
        document.getElementById('catalogNotice').textContent =
          'Connessione a Google Sheets non disponibile: stai vedendo una copia memorizzata. Le modifiche recenti potrebbero non apparire.';
        return cached;
      }
    } catch (ignore) {}
    sheetLoaded = false;
    document.getElementById('catalogNotice').textContent =
      'Impossibile caricare il catalogo da Google Sheets (' + e.message + '). Controlla che il CSV pubblicato contenga i 244 titoli migrati e aggiorna la pagina.';
    throw e;
  }
}

async function refreshAfterEdit() {
  // Il CSV pubblicato da Google può impiegare del tempo ad aggiornarsi.
  clearCatalogCache();
  try {
    await loadMoviesWithCache(true);
    document.getElementById('catalogNotice').textContent = '';
    if (currentCatalogType) await renderGrid(currentCatalogType);
  } catch (e) {
    alert('Operazione salvata in Google Sheets, ma il CSV pubblico non risulta ancora aggiornato. Ricarica tra qualche istante.');
  }
}

/* CREA CARD + associa categorie (catalogo) */
async function addCardFor(m){
  try{
    let item = null;

    // 1️⃣ Se ha ID → recupero diretto senza ricerca
    if (m.id) {
      const typePath = (m.type === 'movie' || m.type === 'todo') ? 'movie' : 'tv';
      const url = `${API_BASE}/${typePath}/${m.id}?api_key=${API_KEY}&language=it-IT`;
      const res = await fetch(url);
      item = await res.json();
    }
    // 2️⃣ Altrimenti → ricerca TMDb in inglese
    else {
      const typePath = (m.type === 'movie') ? 'movie' : 'tv';
      const query    = encodeURIComponent(m.search || m.title);
      const url      = `${API_BASE}/search/${typePath}?api_key=${API_KEY}&language=en-US&query=${query}&page=1`;
      const res      = await fetch(url);
      const data     = await res.json();
      if (data.results && data.results.length > 0) item = data.results[0];
    }

    // 3️⃣ Crea la card
    const card = document.createElement('div');
    card.className = 'card';

    // Se non trovato
    if (!item || item.success === false) {
      card.dataset.categories = JSON.stringify([]);
      card.innerHTML = `<div style="padding:12px">
        <div class="title">${m.title}</div>
        <div class="meta">Non trovato su TMDb</div>
      </div>`;
      appendAdminActions(card, m);
      grid.appendChild(card);
      return;
    }

    // 4️⃣ Poster verticale + categorie + anno (✅ NO wide)
    const posterUrl = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';

    const genreIds = item.genres ? item.genres.map(g => g.id) : (item.genre_ids || []);
    const cats = [];
    CATEGORY_DEFS.forEach(def => {
      if (def.ids.some(id => genreIds.includes(id))) cats.push(def.key);
    });

    card.dataset.categories = JSON.stringify(cats);
    card.dataset.tmdbId     = item.id;
    card.dataset.type       = m.type;

    const year = (m.type === 'movie' || m.type === 'todo')
      ? (item.release_date   ? item.release_date.substring(0,4)   : '')
      : (item.first_air_date ? item.first_air_date.substring(0,4) : '');

    if (!posterUrl) {
      const placeholder = document.createElement('div');
      placeholder.style.padding = '12px';
      const label = document.createElement('div');
      label.className = 'title';
      label.textContent = m.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = year || '';
      placeholder.append(label, meta);
      card.appendChild(placeholder);
    } else {
      const image = document.createElement('img');
      image.src = posterUrl;
      image.alt = item.title || item.name || m.title;
      image.loading = 'lazy';
      image.decoding = 'async';
      const label = document.createElement('div');
      label.className = 'title';
      label.textContent = m.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = year;
      card.append(image, label, meta);
    }
    card.onclick = () => showDetails(item.id, m.type);
    appendAdminActions(card, m);
    grid.appendChild(card);

  } catch(e){
    console.error('Errore fetch card', e);
  }
}

async function runMovieAction(movie, action) {
  if (!isAdmin()) return alert('Sessione scaduta. Effettua nuovamente l’accesso.');
  if (adminBusy) return;
  const verb = action === 'delete' ? 'ELIMINARE DEFINITIVAMENTE' : 'segnare come VISTO';
  const kind = movie.type === 'tv' ? 'serie TV' : 'film';
  if (!confirm(`Vuoi ${verb} il ${kind} "${movie.title}"?`)) return;
  adminBusy = true;
  try {
    const response = await fetch(WORKER_BASE + '/movie/' + action, {
      method: 'POST',
      headers: {'Content-Type':'application/json', Authorization:'Bearer ' + adminToken},
      body: JSON.stringify({title: movie.title, type: movie.type})
    });
    const result = await response.json();
    if (!response.ok || !result.success) {
      if (response.status === 401) { adminToken = null; adminExpiresAt = 0; updateAdminUI(); }
      throw new Error(result.error || 'OPERAZIONE_NON_RIUSCITA');
    }
    alert(action === 'delete' ? 'Titolo eliminato dal Google Sheets ufficiale.' : 'Titolo segnato come visto.');
    await refreshAfterEdit();
  } catch (e) {
    alert('Attenzione: ' + e.message + '. Prima di riprovare verifica il Google Sheets ufficiale.');
  } finally { adminBusy = false; }
}

async function renderHeroGrid() {
  const heroGrid = document.getElementById("heroGrid");
  if (!heroGrid) return;

  heroGrid.innerHTML = "";

  // ✅ cache
  const cached = localStorage.getItem(CACHE_KEYS.heroGrid);
  if (cached) {
    const items = JSON.parse(cached);

    items.forEach(it => {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";

      if (it.kind === "backdrop") {
        img.src = `https://image.tmdb.org/t/p/w780${it.path}`;
        img.classList.add("wide");
      } else {
        img.src = `https://image.tmdb.org/t/p/w342${it.path}`;
      }

      heroGrid.appendChild(img);
    });

    heroGrid.classList.add("visible");
    console.log("⚡ Hero grid da cache");
    return;
  }

  console.log("🌐 Hero grid da TMDb");

  const picks = movies
    .filter(m => m.type === "movie")
    .sort(() => 0.5 - Math.random())
    .slice(0, 80);

  const promises = picks.map(m => {
    const query = encodeURIComponent(m.search || m.title);
    const url = `${API_BASE}/search/movie?api_key=${API_KEY}&language=it-IT&query=${query}`;

    return fetch(url)
      .then(res => res.json())
      .then(data => {
        const r = data.results?.[0];
        if (!r) return null;

        // TMDb nativi:
        // poster_path (verticale) + backdrop_path (orizzontale)
        const poster = r.poster_path || null;
        const backdrop = r.backdrop_path || null;

        // scegli backdrop SOLO se esiste (es. 1 su 5)
        if (backdrop && Math.random() < 0.20) {
          return { kind: "backdrop", path: backdrop };
        }

        if (poster) {
          return { kind: "poster", path: poster };
        }

        // se non ho poster ma ho backdrop, usalo comunque
        if (backdrop) {
          return { kind: "backdrop", path: backdrop };
        }

        return null;
      })
      .catch(() => null);
  });

  const items = (await Promise.all(promises)).filter(Boolean);

  items.forEach(it => {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";

    if (it.kind === "backdrop") {
      img.src = `https://image.tmdb.org/t/p/w780${it.path}`;
      img.classList.add("wide");
    } else {
      img.src = `https://image.tmdb.org/t/p/w342${it.path}`;
    }

    heroGrid.appendChild(img);
  });

  requestAnimationFrame(() => heroGrid.classList.add("visible"));

  localStorage.setItem(CACHE_KEYS.heroGrid, JSON.stringify(items));
}

    await renderHeroGrid();

window.addEventListener("scroll", () => {
    const bar = document.querySelector(".controls");
    if(window.scrollY > 80){
        bar.classList.add("scrolled");
    } else {
        bar.classList.remove("scrolled");
    }
});
